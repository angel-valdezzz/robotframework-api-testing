name: Verify API testing example
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: latest-reports-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  demo:
    outputs:
      ready: ${{ steps.reports.outcome }}
      artifact_id: ${{ steps.reports.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry check --lock
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run robocop check resources tests
      - run: poetry run robocop format --check resources tests
      - run: poetry run python -m unittest discover -s scripts -p "test_*.py"
      - name: Execute API scenarios
        id: demo
        run: poetry run python scripts/run_demo.py --local

      - name: Prepare latest reports
        id: site
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.demo.outcome }}
        run: python scripts/build_latest.py --kind api --outcome "$VALIDATION_OUTCOME"
      - name: Upload report bundle
        id: reports
        if: always() && steps.site.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: case-reports
          path: report-site/
          retention-days: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 7 || 1 }}
          if-no-files-found: error
      - name: Prepare Pages deployment
        if: always() && steps.site.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: report-site/
          retention-days: 1
  publish:
    if: always() && needs.demo.outputs.ready == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify current main commit
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "An updated main execution will publish its reports."
          fi
      - name: Deploy latest reports
        id: deployment
        if: steps.fresh.outputs.current == 'true'
        uses: actions/deploy-pages@v4
      - uses: actions/setup-python@v6
        if: steps.deployment.outcome == 'success'
        with:
          python-version: '3.12'
      - name: Retain only current main report bundle
        if: steps.deployment.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_ID: ${{ needs.demo.outputs.artifact_id }}
          REPORT_ARTIFACT_NAMES: case-reports
        run: python scripts/retain_latest.py
      - name: Link published reports
        if: steps.deployment.outcome == 'success'
        run: echo "[Última ejecución y ZIP](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
