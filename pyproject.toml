[project]
name = "robotframework-api-testing"
version = "0.1.0"
description = "Executable Robot Framework API example with independent case reports."
requires-python = ">=3.12,<4"
dependencies = [
    "robotframework==7.5",
    "robotframework-paylo (==0.1.0)",
    "robotframework-requests==0.9.7",
    "robotframework-datadriver==1.11.2",
    "robotframework-request-reporter (==0.6.0)",
    "robotframework-request-logger (==0.1.0)",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.5.1,<3"

[dependency-groups]
dev = [
    "robotframework-robocop (>=9.1.0,<10.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "demo-users-api @ git+https://github.com/angel-valdezzz/demo-users-api.git@63bb25c5cfd808a61a2efce275b266fa5620ea19"
]

[tool.robocop]
target-version = 7

[tool.robocop.lint]
threshold = "E"

[tool.robocop.format]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
